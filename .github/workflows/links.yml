name: Link check
on:
  schedule:
    - cron: "0 12 * * 1"
  pull_request:
    paths: ["src/content/**"]
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check-links
